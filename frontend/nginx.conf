# Serves the built SPA and stands in for the Vite dev proxy.
#
# The point is same-origin: the browser asks localhost:5173 for everything, so the
# session cookie rides along without CORS and without credentialed cross-origin
# requests. The BFF is reachable here and nowhere else in the page's world.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compiled assets are content-hashed, so a filename never changes meaning and a
    # year is safe. index.html is not hashed and must never be cached, or a browser
    # keeps loading last week's asset names after a deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://bff:8001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Bulk import is slow by nature; the default 60s cuts it off mid-upload.
        proxy_read_timeout 120s;
        client_max_body_size 25m;  # matches the BFF's own body limit
    }

    location /auth/ {
        proxy_pass http://bff:8001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The login flow is a chain of 302s to Keycloak and back. Following them here
        # would break it: the browser must see each one.
        proxy_redirect off;
    }

    # The assistant. Without this block a POST here falls through to the static
    # handler below, and nginx answers 405 - you cannot POST a file.
    location /chat/ {
        proxy_pass http://bff:8001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The answer is streamed, and every default here works against that.
        #
        # proxy_buffering on (the default) makes nginx collect the whole response
        # before sending any of it, which turns a streamed answer back into a
        # single delayed blob - undoing the streaming end to end. HTTP/1.1 with an
        # empty Connection header keeps the upstream connection from being closed
        # and re-chunked.
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # A tool round plus generation can take a while on a free-tier model, and
        # an SSE connection is idle between events by design. The default 60s would
        # cut an answer off mid-sentence.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # A client-side router owns every other path. Without this, a reload on
    # /employees asks nginx for a file that does not exist and gets a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
